name: Android build

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: JDK を設定
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle を設定
        uses: gradle/actions/setup-gradle@v4

      - name: 単体テストとデバッグ APK をビルド
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: デバッグ APK を保存
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
