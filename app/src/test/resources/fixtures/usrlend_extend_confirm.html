<!--
  貸出延長 1段階目POST(WOpacUsrLendListExtendAction.do?mngFlg1_handan=1)の応答の構造を、
  実サイトのHAR実測(docs/site-research.md §10)から起こしたフィクスチャ。

  値はすべてマスクしてある(hash・para・資料コードはダミー)。構造だけが実サイト由来である。
  実サイトで確認した重要な構造:

    1. form name="prevRequestForm" に action 属性が「無い」。送信先はページ内スクリプトが
       document.prevRequestForm.action = "..." と実行時に代入する。
       Jsoupで form.attr("action") を読んでも空文字列にしかならない。
    2. 同じページに LBFormMF と LBForm も存在する(いずれも action 属性を持たない)。
    3. prevRequestForm の hidden は18項目で、btnflg と checkflag が各2回出現する。
       これは1段階目の query(mngFlg1_handan) + body(17項目) の全パラメータに一致する。
    4. 確認コードは okArray へ "OPACUSR005" を積む形で現れ、hidden の名前は
       var OK_CODES_NAME = "okCodes" で定義される。

  実際の応答は貸出状況一覧の全体(usrlend.html 相当の一覧表)も含むが、確認フォームの
  パーサ検証に不要な部分は省いてある。一覧表の構造は usrlend.html を参照すること。

  日本語のダイアログ文言はHARの文字コード破損により実測できていないため、
  プレースホルダを置いてある(パーサは文言に依存しない)。
-->
